<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 링크</title>
<meta name="description" content="내 링크 모음">
<meta property="og:title" content="내 링크">
<meta property="og:description" content="내 링크 모음">
<meta property="og:type" content="website">
<style>
  :root { --bg1:#1e1b4b; --bg2:#4c1d95; --text:#fff; --card:#ffffff22; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: -apple-system, "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2)) fixed;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 480px; padding: 48px 16px 64px; }
  .profile { text-align: center; margin-bottom: 28px; }
  .avatar {
    width: 88px; height: 88px; border-radius: 50%; object-fit: cover;
    background: var(--card); display: inline-flex; align-items: center;
    justify-content: center; font-size: 36px; margin-bottom: 12px;
  }
  h1 { margin: 0 0 6px; font-size: 22px; }
  .bio { margin: 0; opacity: .8; font-size: 14px; white-space: pre-line; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    background: var(--card); backdrop-filter: blur(8px);
    border-radius: 16px; color: inherit; text-decoration: none;
    transition: transform .15s, background .15s;
  }
  .link:hover { transform: translateY(-2px); }
  .thumb {
    width: 44px; height: 44px; border-radius: 12px; flex: none; object-fit: cover;
    background: #ffffff22; display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .title { flex: 1; text-align: center; font-size: 15px; font-weight: 600; padding-right: 44px; }
</style>
</head>
<body>
<main>
  <section class="profile" id="profile"></section>
  <nav class="links" id="links"></nav>
</main>
<script>
  const safeUrl = (u) => /^(https?:|mailto:|tel:)/i.test(u) ? u : '#';
  const isImg = (s) => /^(https?:\/\/|\/|\.\/)/.test(s || '');

  function iconEl(src, cls, fallback) {
    if (isImg(src)) {
      const img = document.createElement('img');
      img.src = src; img.alt = ''; img.className = cls;
      return img;
    }
    const d = document.createElement('div');
    d.className = cls; d.textContent = src || fallback;
    return d;
  }

  function render(data) {
    const t = data.theme || {};
    const r = document.documentElement.style;
    if (t.bg1) r.setProperty('--bg1', t.bg1);
    if (t.bg2) r.setProperty('--bg2', t.bg2);
    if (t.text) r.setProperty('--text', t.text);
    if (t.card) r.setProperty('--card', t.card);

    document.title = data.name || '내 링크';
    document.querySelector('meta[property="og:title"]').content = document.title;
    document.querySelector('meta[property="og:description"]').content = data.bio || '';

    const p = document.getElementById('profile');
    p.replaceChildren();
    p.append(iconEl(data.avatar, 'avatar', '🙂'));
    const h = document.createElement('h1'); h.textContent = data.name || '';
    const b = document.createElement('p'); b.className = 'bio'; b.textContent = data.bio || '';
    p.append(h, b);

    const nav = document.getElementById('links');
    nav.replaceChildren();
    (data.links || []).forEach(l => {
      const a = document.createElement('a');
      a.className = 'link'; a.href = safeUrl(l.url);
      a.target = '_blank'; a.rel = 'noopener noreferrer';
      const title = document.createElement('span');
      title.className = 'title'; title.textContent = l.title || '';
      a.append(iconEl(l.icon, 'thumb', '🔗'), title);
      nav.append(a);
    });
  }

  fetch('links.json', { cache: 'no-cache' })
    .then(r => r.json()).then(render)
    .catch(() => { document.getElementById('profile').textContent = 'links.json을 불러오지 못했어요.'; });
</script>
</body>
</html>
