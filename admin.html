<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>링크 편집기</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Pretendard", "Noto Sans KR", system-ui, sans-serif; background: #f4f4f7; color: #222; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 20px; } h2 { font-size: 15px; margin: 24px 0 8px; }
  .box { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 3px #0001; }
  label { display: block; font-size: 12px; color: #666; margin: 8px 0 3px; }
  input, textarea { width: 100%; padding: 8px 10px; border: 1px solid #d5d5dc; border-radius: 8px; font: inherit; }
  textarea { resize: vertical; min-height: 60px; }
  .row { display: grid; grid-template-columns: 70px 1fr; gap: 8px; }
  .colors { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  input[type=color] { height: 38px; padding: 2px; }
  .btns { display: flex; gap: 6px; margin-top: 10px; }
  button { padding: 8px 12px; border: 0; border-radius: 8px; cursor: pointer; background: #e6e6ee; font: inherit; }
  button.primary { background: #5b3fd6; color: #fff; }
  button.danger { background: #fde2e2; color: #b00020; margin-left: auto; }
  .bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 10px 16px; display: flex; gap: 8px; justify-content: center; box-shadow: 0 -1px 4px #0002; }
  .hint { font-size: 12px; color: #777; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1>링크 편집기</h1>
  <p class="hint">수정 후 아래 <b>links.json 다운로드</b>를 누르고, 받은 파일을 사이트 폴더의 links.json에 덮어쓰세요. 배포(git push)하면 반영돼요.</p>

  <h2>프로필</h2>
  <div class="box">
    <label>이름</label><input id="name">
    <label>소개 (줄바꿈 가능)</label><textarea id="bio"></textarea>
    <label>프로필 이미지 (URL 또는 이모지, 비우면 🙂)</label><input id="avatar">
  </div>

  <h2>색상</h2>
  <div class="box colors">
    <div><label>배경 시작색</label><input type="color" id="bg1"></div>
    <div><label>배경 끝색</label><input type="color" id="bg2"></div>
    <div><label>글자색</label><input type="color" id="text"></div>
    <div><label>카드 색 (흰색 반투명 고정)</label><input id="card" placeholder="#ffffff22"></div>
  </div>

  <h2>링크</h2>
  <div id="list"></div>
  <button id="add">+ 링크 추가</button>
</main>

<div class="bar">
  <button class="primary" id="download">links.json 다운로드</button>
  <button id="copy">JSON 복사</button>
</div>

<script>
  let data = { name: '', bio: '', avatar: '', theme: {}, links: [] };
  const $ = (id) => document.getElementById(id);

  function toHex(c, fb) { return /^#[0-9a-f]{6}$/i.test(c || '') ? c : fb; }

  function load() {
    $('name').value = data.name || '';
    $('bio').value = data.bio || '';
    $('avatar').value = data.avatar || '';
    const t = data.theme || {};
    $('bg1').value = toHex(t.bg1, '#1e1b4b');
    $('bg2').value = toHex(t.bg2, '#4c1d95');
    $('text').value = toHex(t.text, '#ffffff');
    $('card').value = t.card || '#ffffff22';
    renderList();
  }

  function renderList() {
    const list = $('list'); list.replaceChildren();
    data.links.forEach((l, i) => {
      const box = document.createElement('div'); box.className = 'box';
      box.innerHTML = `
        <div class="row">
          <div><label>아이콘</label><input data-k="icon"></div>
          <div><label>제목</label><input data-k="title"></div>
        </div>
        <label>URL (https://, mailto:, tel:)</label><input data-k="url">
        <div class="btns">
          <button data-a="up">↑</button><button data-a="down">↓</button>
          <button class="danger" data-a="del">삭제</button>
        </div>`;
      box.querySelectorAll('input').forEach(inp => {
        inp.value = l[inp.dataset.k] || '';
        inp.oninput = () => { l[inp.dataset.k] = inp.value; };
      });
      box.querySelector('[data-a=up]').onclick = () => move(i, -1);
      box.querySelector('[data-a=down]').onclick = () => move(i, 1);
      box.querySelector('[data-a=del]').onclick = () => { data.links.splice(i, 1); renderList(); };
      list.append(box);
    });
  }

  function move(i, d) {
    const j = i + d;
    if (j < 0 || j >= data.links.length) return;
    [data.links[i], data.links[j]] = [data.links[j], data.links[i]];
    renderList();
  }

  function collect() {
    return {
      name: $('name').value, bio: $('bio').value, avatar: $('avatar').value,
      theme: { bg1: $('bg1').value, bg2: $('bg2').value, text: $('text').value, card: $('card').value },
      links: data.links
    };
  }

  $('add').onclick = () => { data.links.push({ title: '', url: 'https://', icon: '🔗' }); renderList(); };
  $('download').onclick = () => {
    const blob = new Blob([JSON.stringify(collect(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'links.json'; a.click();
  };
  $('copy').onclick = async () => {
    await navigator.clipboard.writeText(JSON.stringify(collect(), null, 2));
    $('copy').textContent = '복사됨!'; setTimeout(() => $('copy').textContent = 'JSON 복사', 1500);
  };

  fetch('links.json', { cache: 'no-cache' }).then(r => r.json())
    .then(j => { data = j; data.links = data.links || []; load(); })
    .catch(() => load());
</script>
</body>
</html>
